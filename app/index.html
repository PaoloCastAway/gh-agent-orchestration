<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <h1>Project Pulse</h1>
      <p>Live status across all active projects.</p>
    </header>

    <main class="dashboard">
      <section class="projects-section" aria-label="Projects">
        <div class="project-list" role="list" aria-live="polite"></div>
        <p class="empty-state" hidden>No projects to display yet.</p>
        <p class="error-state" role="alert" hidden></p>
      </section>
    </main>

    <footer class="site-footer">
      <small>This app must be served over HTTP (not opened as a file://) for data loading to work.</small>
    </footer>

    <script type="module">
      const projectList = document.querySelector('.project-list');
      const emptyState = document.querySelector('.empty-state');
      const errorState = document.querySelector('.error-state');

      const statusModifiers = new Map([
        ['On Track', 'on-track'],
        ['At Risk', 'at-risk'],
        ['Blocked', 'blocked'],
        ['Complete', 'complete']
      ]);

      const priorityModifiers = new Map([
        ['High', 'high'],
        ['Medium', 'medium'],
        ['Low', 'low']
      ]);

      function createTextElement(tagName, className, text) {
        const element = document.createElement(tagName);

        if (className) {
          element.className = className;
        }

        element.textContent = text;
        return element;
      }

      function createBadge(projectStatus) {
        const status = projectStatus || 'Unknown';
        const modifier = statusModifiers.get(status) || 'unknown';
        const badge = document.createElement('span');
        badge.className = `status-badge status-badge--${modifier}`;

        const label = createTextElement('span', 'visually-hidden', 'Status: ');
        const statusText = document.createTextNode(status);

        badge.append(label, statusText);
        return badge;
      }

      function createPriority(projectPriority) {
        const priority = projectPriority || 'Unknown';
        const modifier = priorityModifiers.get(priority) || 'unknown';
        const indicator = document.createElement('span');
        indicator.className = `priority priority--${modifier}`;

        const label = createTextElement('span', 'visually-hidden', 'Priority: ');
        const priorityText = document.createTextNode(priority);

        indicator.append(label, priorityText);
        return indicator;
      }

      function createProjectCard(project) {
        const card = document.createElement('article');
        card.className = 'project-card';
        card.setAttribute('role', 'listitem');

        const title = createTextElement('h2', '', project.name || 'Untitled project');
        const owner = createTextElement('p', 'project-owner', `Owner: ${project.owner || 'Unassigned'}`);
        const status = createBadge(project.status);
        const recentActivity = createTextElement(
          'p',
          'recent-activity',
          project.recentActivity || 'No recent activity recorded.'
        );
        const priority = createPriority(project.priority);

        card.append(title, owner, status, recentActivity, priority);
        return card;
      }

      function renderProjects(projects) {
        projectList.replaceChildren();
        emptyState.hidden = true;
        errorState.hidden = true;
        errorState.textContent = '';

        if (projects.length === 0) {
          emptyState.hidden = false;
          return;
        }

        const fragment = document.createDocumentFragment();
        projects.forEach((project) => {
          fragment.append(createProjectCard(project));
        });
        projectList.append(fragment);
      }

      function showError(error) {
        projectList.replaceChildren();
        emptyState.hidden = true;
        errorState.hidden = false;
        errorState.textContent = `Unable to load project data: ${error.message}`;
      }

      async function loadProjects() {
        const response = await fetch('./project-data.json');

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const data = await response.json();

        if (!data || !Array.isArray(data.projects)) {
          throw new Error('Malformed project data: expected a projects array.');
        }

        renderProjects(data.projects);
      }

      loadProjects().catch(showError);
    </script>
  </body>
</html>
